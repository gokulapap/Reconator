name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, tests, migration, audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconator
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: reconator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reconator -d reconator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check . ../toolbox
          ruff format --check . ../toolbox
      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest
      - name: PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://reconator:ci-only@127.0.0.1:5432/reconator
        run: |
          alembic upgrade head
          alembic current
      - name: Python vulnerability audit
        run: pip-audit -r requirements-dev.txt

  frontend:
    name: Frontend (lint + tests + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker Compose (build + smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-only
      ADMIN_API_KEY: ci-only
      TOOLBOX_SHARED_SECRET: ci-only-independent-toolbox-secret
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build service images
        run: docker compose build api web toolbox
      - name: Start production topology
        run: docker compose up -d db migrate api toolbox worker web
      - name: Smoke API and web proxy
        run: |
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:8000/api/v1/ready
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:3000/api/v1/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/v1/targets)" = "401"
          test "$(docker compose exec -T worker python -c 'from app.recon.modules.builtin import register_builtin_modules; from app.recon.modules.registry import registry; register_builtin_modules(); print(sum(registry.is_available(m) for m in registry.all()))')" -ge "22"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop topology
        if: always()
        run: docker compose down --volumes
